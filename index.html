const CHEV_SVG = '<svg class="chev" viewBox="0 0 512 512" aria-hidden="true"><path d="M330 44 L170 256 L330 468"/></svg>';

function buildCard(item, i) {
  const icon = ICONS[item.platform] || ICONS.website;
  const a = document.createElement("a");
  a.className = "btn" + (item.featured ? " featured" : "");
  a.dataset.p = item.platform;
  a.href = item.url;                       /* الرابط كما هو — دون أي تغيير */
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.style.setProperty("--i", i);
  a.setAttribute("aria-label", item.title + " — " + item.sub);
  a.innerHTML =
    '<span class="badge"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="' + icon + '"/></svg></span>' +
    '<span class="txt">' +
      '<span class="t">' + item.title + (item.tag ? ' <span class="tag">' + item.tag + "</span>" : "") + "</span>" +
      '<span class="s">' + item.sub + "</span>" +
    "</span>" + CHEV_SVG;
  return a;
}

const linksEl = document.getElementById("links");
LINKS.forEach((item, i) => linksEl.appendChild(buildCard(item, i)));

/* ─── إشعار صغير ─── */
const toastEl = document.getElementById("toast");
let toastTimer;
function toast(msg) {
  toastEl.innerHTML = msg + ' <svg viewBox="0 0 512 512" aria-hidden="true"><path d="' + ICONS.check + '"/></svg>';
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}

/* ─── نسخ الرابط ─── */
async function copyLink() {
  try {
    await navigator.clipboard.writeText(SITE_URL);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = SITE_URL;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  toast("تم نسخ رابط الصفحة");
}
document.getElementById("copyBtn").addEventListener("click", copyLink);

/* ─── مشاركة الصفحة ─── */
document.getElementById("shareBtn").addEventListener("click", async () => {
  if (navigator.share) {
    try {
      await navigator.share({
        title: "محلات أبو بشار للملابس والأحذية",
        text: "تابعنا على جميع منصات التواصل الاجتماعي",
        url: SITE_URL,
      });
    } catch (e) { /* أُلغيت المشاركة */ }
  } else {
    copyLink();
  }
});

/* ─── نافذة QR ─── */
const qrDialog = document.getElementById("qrDialog");
document.getElementById("qrBtn").addEventListener("click", () => {
  if (typeof qrDialog.showModal === "function") qrDialog.showModal();
  else qrDialog.setAttribute("open", "");
});
qrDialog.addEventListener("click", (e) => {
  if (e.target === qrDialog) qrDialog.close(); /* النقر خارج النافذة يغلقها */
});
